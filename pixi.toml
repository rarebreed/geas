[project]
name = "geas"
version = "0.1.0"
description = "Event driven task execution framework "
authors = ["Sean Toner <placeoftheway@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64"]

[tasks]

[dependencies]
python = ">=3.12"
trio = ">=0.25.0,<0.26"
pydantic = ">=2.7.0,<2.8"
pyarrow = ">=15.0.2,<15.1"
polars = ">=0.20.20,<0.21"
tomli-w = ">=1.0.0,<1.1"

[feature.test.dependencies]
autopep8 = ">=1.3.2,<2.2"
ruff = ">=0.3.7,<0.4"
pytest = ">=7.2.0,<8.2"
pytest-asyncio = ">=0.14.0,<0.24"
