[project]
name = "geas"
version = "0.1.0"
description = "Event driven task execution framework "
authors = ["Sean Toner <placeoftheway@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64"]

[tasks]
ollama-run = {cmd = "ollama run llama3.1:8b"}
ollama-pull = "ollama pull llama3.1:8b"
ollama-status = {cmd = "sudo systemctl status ollama"}
ollama-ps = "ollama ps"
vscode-ext = {cmd = ["code", "--install-extension", "Continue.continue"]}


[dependencies]
python = ">=3.12"
tomli-w = ">=1.0.0,<1.1"
trio = ">=0.26.2,<0.27"
pyarrow = ">=17.0.0,<18"
pydantic = ">=2.8.2,<3"
loguru = ">=0.7.2,<0.8"

[feature.dev.dependencies]
autopep8 = ">=1.3.2,<2.2"
pytest-asyncio = ">=0.14.0,<0.24"
pytest = ">=8.3.2,<9"
ruff = ">=0.6.2,<0.7"

[feature.dev.tasks]
fmt = "autopep8 -i -r ."
lint = "ruff check --fix ."
test = "pytest -v"
check = {depends-on = ["fmt", "lint", "test"]}
git-add = {cmd = ["git", "add", "."], depends-on = ["check"]}
commit= {cmd = "git commit -m ", depends-on = ["git-add"]}
push = {cmd  = "git push origin "}

[environments]
dev = ["dev"]

[pypi-dependencies]
getdaft = { version = "*", extras = ["aws"] }
mypy = { version = ">=1.11.2, <2", extras = ["mypyc"] }
polars = ">=1.6.0, <2"
